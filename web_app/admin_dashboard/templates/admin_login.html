{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Portal Gateway - Sign In</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background-color: #0f172a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        color: #f8fafc;
      }
      .login-card {
        background-color: #1e293b;
        border: 1px solid #334155;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        width: 360px;
        text-align: center;
      }
      h2 {
        margin: 0 0 8px 0;
        font-size: 22px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px 0;
        font-size: 12px;
        color: #94a3b8;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .form-group {
        margin-bottom: 20px;
        text-align: left;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
        margin-bottom: 6px;
        letter-spacing: 0.02em;
      }
      .input-field {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #334155;
        background-color: #0f172a;
        color: #ffffff;
        font-size: 14px;
        box-sizing: border-box;
      }
      .input-field:focus {
        outline: none;
        border-color: #ff9800;
      }

      /* 👁️ NEW: PURE VISIBILITY TOGGLE STRUCTURAL STYLES */
      .toggle-container {
        display: flex;
        align-items: center;
        margin-top: 8px;
        cursor: pointer;
        user-select: none;
      }
      .toggle-checkbox {
        width: 14px;
        height: 14px;
        accent-color: #ff9800;
        margin: 0 6px 0 0;
        cursor: pointer;
      }
      .toggle-label {
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        cursor: pointer;
      }
      .toggle-checkbox:checked ~ .toggle-label {
        color: #ffffff;
      }

      .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background-color: #ff9800;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.15s;
      }
      .btn:hover {
        background-color: #e68a00;
      }
      .error {
        background-color: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fca5a5;
        padding: 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 20px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <img
        src="{% static 'admin_dashboard/images/puclogo.png' %}"
        alt="PUC Bookstore Logo"
        class="w-16 h-16 object-contain mb-4"
        style="display: inline-block; margin-left: auto; margin-right: auto"
      />

      <h2>PUC Digital Bookstore Back-Office</h2>
      <p>Administrative Control Access</p>

      <!-- Error Messaging Node block -->
      {% if error %}
      <div class="error">⚠️ {{ error }}</div>
      {% endif %}

      <form method="POST" action="{% url 'admin_login' %}">
        {% csrf_token %}
        <div class="form-group">
          <label>Username</label>
          <input
            type="text"
            name="username"
            class="input-field"
            placeholder="e.g. admin"
            required
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label>Security Password</label>
          <!-- so the toggle script can locate-->
          <input
            type="password"
            id="password-input"
            name="password"
            class="input-field"
            placeholder="••••••••"
            required
          />

          <!--VISIBILITY TOGGLE CHECKBOX -->
          <label class="toggle-container">
            <input
              type="checkbox"
              class="toggle-checkbox"
              onclick="togglePasswordVisibility()"
            />
            <span class="toggle-label">Show Password</span>
          </label>
        </div>

        <button type="submit" class="btn">Sign In to Dashboard</button>
      </form>
    </div>

    <!-- toggles-->
    <script>
      function togglePasswordVisibility() {
        var passInput = document.getElementById("password-input");
        if (passInput.type === "password") {
          passInput.type = "text";
        } else {
          passInput.type = "password";
        }
      }
    </script>
  </body>
</html>
