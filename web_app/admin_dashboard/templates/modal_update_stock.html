<!-- THE BULK UPDATE STOCK MODAL OVERLAY (Centered, High-Contrast & Spaced) -->

<div
  id="bulk-stock-modal"
  class="fixed inset-0 w-full h-full bg-slate-900/40 backdrop-blur-sm p-4"
  style="
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    z-index: 99999 !important;
    display: none;
    align-items: center !important;
    justify-content: center !important;
  "
>
  <!-- Floating Modal Card Frame -->
  <div
    class="bg-white rounded-xl shadow-lg border border-slate-300 w-full max-w-md overflow-hidden flex flex-col mx-auto my-auto animate-pop stock-modal-frame"
  >
    <!--Blue Header Title Bar Section -->
    <div
      class="bg-[#16163f] text-white p-4 px-6 flex justify-between items-center flex-shrink-0"
    >
      <h3 class="font-bold text-sm tracking-wide">Batch Stock Adjustment</h3>
      <!-- button to auto-formatter bugs -->
      <button
        type="button"
        onclick="
          document
            .getElementById('bulk-stock-modal')
            .style.setProperty('display', 'none', 'important')
        "
        class="hover:opacity-75 text-lg font-bold transition focus:outline-none"
      >
        ✕
      </button>
    </div>

    <!-- 2. UPDATE ACTION SELECTION FORM -->

    <form
      action="{% url 'bulk_update_books_backend' %}"
      method="POST"
      class="bg-white flex flex-col m-0"
      onclick="event.stopPropagation()"
    >
      {% csrf_token %}

      <!-- HOOKED INTERLINK SELECTION DATA TRACKERS -->
      <input
        type="hidden"
        id="bulk-ids-stock-tracker"
        name="selected_book_ids_string"
        value=""
      />
      <input type="hidden" name="bulk_action_type_flag" value="bulk_stock" />

      <!-- Contextual Selection Alert Banner -->
      <div
        class="bg-slate-50 border-b border-slate-100 p-4 px-6 flex flex-col gap-1 flex-shrink-0"
      >
        <p class="text-xs font-semibold text-slate-500">
          Applying to selected books.
        </p>
        <h4 class="text-sm font-black text-slate-800 tracking-tight mt-0.5">
          Choose adjustment type:
        </h4>
      </div>

      <!-- Selection Radio Options Container -->
      <div class="p-6 pb-2 space-y-1 bg-white">
        <!-- Strategy Option A: Add to count -->
        <label
          class="stock-item-row flex items-center gap-2 py-1.5 cursor-pointer"
          style="margin-bottom: 12px !important"
        >
          <!-- FIXED DIRECTION KEY: name="bulk_stock_strategy" -->
          <input
            type="radio"
            name="bulk_stock_strategy"
            value="add"
            class="stock-radio"
            checked
          />
          <span class="text-sm font-semibold text-slate-700"
            >Add to current stock count</span
          >
        </label>

        <!-- Strategy Option B: Direct reset -->
        <label
          class="stock-item-row flex items-center gap-2 py-1.5 cursor-pointer"
        >
          <!-- FIXED DIRECTION KEY-->
          <input
            type="radio"
            name="bulk_stock_strategy"
            value="set"
            class="stock-radio"
          />
          <span class="text-sm font-semibold text-slate-700"
            >Set to an exact fixed amount</span
          >
        </label>
      </div>

      <!-- Quantity Entry Input Section Box -->
      <div class="p-6 pt-2 pb-6 flex flex-col gap-2 bg-white">
        <label
          class="block text-[11px] font-black text-slate-500 uppercase tracking-wider pl-1"
          >Enter quantity</label
        >
        <!-- FIXED AMOUNT KEY-->
        <input
          type="number"
          name="bulk_stock_value"
          placeholder="e.g. 10..."
          value="0"
          min="0"
          class="w-full h-10 bg-white border-2 border-slate-400 rounded-lg px-3 text-sm font-medium text-slate-800 text-center font-bold focus:outline-none focus:border-indigo-600 transition"
          style="
            border: 2px solid #94a3b8 !important;
            outline: none !important;
            text-align: left !important;
          "
          required
        />
      </div>

      <!-- 3. FOOTER ACTIONS CONTROL BAR -->
      <div
        class="flex items-center justify-end space-x-3 p-4 px-6 border-t border-slate-200 bg-slate-50 flex-shrink-0"
      >
        <!-- 🎯 CANCEL BUTTON: Styled as a soft slate capsule with premium hover highlights -->
        <button
          type="button"
          onclick="
            document
              .getElementById('update-stock-modal')
              .style.setProperty('display', 'none', 'important')
          "
          class="px-5 py-2 h-10 rounded-lg text-xs font-bold uppercase tracking-wider transition shadow-sm focus:outline-none"
          style="
            background-color: #f1f5f9 !important;
            color: #334155 !important;
            border: 1px solid #cbd5e1 !important;
            display: inline-block !important;
            cursor: pointer !important;
            transition: all 0.15s ease-in-out !important;
          "
          onmouseover="
            this.style.backgroundColor = '#e2e8f0';
            this.style.borderColor = '#94a3b8';
          "
          onmouseout="
            this.style.backgroundColor = '#f1f5f9';
            this.style.borderColor = '#cbd5e1';
          "
        >
          Cancel
        </button>

        <!-- 💛 APPLY BUTTON: High-contrast corporate yellow block with a deeper gold hover shift -->
        <button
          type="submit"
          class="px-5 py-2 h-10 rounded-lg text-xs font-bold uppercase tracking-wider transition shadow-sm focus:outline-none"
          style="
            background-color: #eab308 !important; /* 💛 Professional warm amber/yellow fill */
            color: #0f172a !important; /* 💛 Ultra-dark slate text for perfect contrast readability */
            border: none !important;
            display: inline-block !important;
            cursor: pointer !important;
            transition: all 0.15s ease-in-out !important;
          "
          onmouseover="this.style.backgroundColor = '#ca8a04'"
          onmouseout="this.style.backgroundColor = '#eab308'"
        >
          Apply
        </button>
      </div>
    </form>
  </div>
</div>
