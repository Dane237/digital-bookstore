<!-- THE CSV IMPORT OVERLAY MODAL  -->
<div
  id="import-csv-modal"
  class="fixed inset-0 w-full h-full bg-slate-900/40 backdrop-blur-sm p-4"
  style="
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    z-index: 99999 !important;
    display: none;
    align-items: center !important;
    justify-content: center !important;
  "
>
  <!-- Floating Modal Card Frame -->
  <div
    class="bg-white rounded-xl shadow-lg border border-slate-300 w-full max-w-md overflow-hidden flex flex-col mx-auto my-auto animate-pop"
  >
    <!-- 🔷 1. Brand Blue Header Title Bar Section -->
    <div
      class="bg-[#16163f] text-white p-4 px-6 flex justify-between items-center flex-shrink-0"
    >
      <h3 class="font-bold text-sm tracking-wide">Import CSV File</h3>
      <!-- Dynamic Close Trigger Cross Icon (Closes overlay cleanly) -->
      <button
        onclick="
          document
            .getElementById('import-csv-modal')
            .style.setProperty('display', 'none', 'important')
        "
        class="hover:opacity-75 text-lg font-bold transition focus:outline-none"
      >
        ✕
      </button>
    </div>

    <!-- 2. FILE SELECTION CORE AREA FRAME WORK -->

    <form
      action="{% url 'import_books_csv_backend' %}"
      method="POST"
      enctype="multipart/form-data"
      class="p-6 bg-slate-50/50 space-y-4 m-0"
      onclick="event.stopPropagation()"
    >
      {% csrf_token %}

      <!-- Dashed Drag & Drop File Target Canvas Box -->
      <div
        class="w-full border-2 border-dashed border-slate-400/80 rounded-xl bg-white p-8 flex flex-col items-center justify-center cursor-pointer hover:border-indigo-600 transition group shadow-sm"
        style="border: 2px dashed #94a3b8 !important"
        onclick="document.getElementById('csv-file-input').click()"
      >
        <!-- Hidden native file input element tracker -->

        <input
          type="file"
          id="csv-file-input"
          name="csv_file"
          accept=".csv"
          class="hidden"
          required
          onchange="
            document.getElementById('csv-file-name').innerText = this.files[0]
              ? this.files[0].name
              : 'Choose CSV File'
          "
        />

        <span
          class="text-3xl text-slate-400 group-hover:text-indigo-600 transition"
          >📄</span
        >
        <h4
          id="csv-file-name"
          class="text-sm font-bold text-slate-700 mt-3 tracking-tight"
        >
          Choose CSV File
        </h4>
        <p class="text-xs text-slate-400 mt-1">
          Spreadsheet ledger data format (.csv) only
        </p>
      </div>

      <!-- Bottom Row Footer Actions Controls Buttons Panel -->
      <div
        class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-200"
        style="margin-top: 10px"
      >
        <!--CANCEL BUTTON-->
        <button
          type="button"
          onclick="
            document
              .getElementById('import-csv-modal')
              .style.setProperty('display', 'none', 'important')
          "
          class="px-5 py-2 h-10 rounded-lg text-xs font-bold uppercase tracking-wider transition shadow-sm focus:outline-none"
          style="
            background-color: #f1f5f9 !important;
            color: #334155 !important;
            border: 1px solid #cbd5e1 !important;
            display: inline-block !important;
            cursor: pointer !important;
            transition: all 0.15s ease-in-out !important;
            margin-top: 10px;
          "
          onmouseover="
            this.style.backgroundColor = '#e2e8f0';
            this.style.borderColor = '#94a3b8';
          "
          onmouseout="
            this.style.backgroundColor = '#f1f5f9';
            this.style.borderColor = '#cbd5e1';
          "
        >
          Cancel
        </button>

        <!--IMPORT BUTTON -->
        <button
          type="submit"
          class="px-5 py-2 h-10 rounded-lg text-xs font-bold uppercase tracking-wider transition shadow-sm focus:outline-none"
          style="
            background-color: #eab308 !important;
            color: #0f172a !important;
            border: none !important;
            display: inline-block !important;
            cursor: pointer !important;
            transition: all 0.15s ease-in-out !important;
            margin-top: 10px;
          "
          onmouseover="this.style.backgroundColor = '#ca8a04'"
          onmouseout="this.style.backgroundColor = '#eab308'"
        >
          Import
        </button>
      </div>
    </form>
  </div>
</div>
