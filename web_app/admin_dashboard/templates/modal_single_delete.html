<!-- THE SELF-CONTAINED POPUP MODALS DELETION ENGINE -->
{% for book in books %}
<div
  id="delete-modal-{{ book.id }}"
  style="
    display: none !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    min-height: 100vh !important;
    background-color: transparent !important;
    z-index: 9999 !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 1rem !important;
  "
>
  <div
    class="bg-white rounded-lg shadow-lg border border-slate-200/80 w-full max-w-md flex flex-col overflow-hidden animate-fade-in"
  >
    <div class="p-6 text-center">
      <!-- Icon Visual Anchor Header -->
      <div
        class="w-12 h-12 rounded-full bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-4 border border-red-100"
      >
        <span class="text-xl">⚠️</span>
      </div>

      <h3
        class="text-sm font-black text-slate-800 uppercase tracking-wider mb-2"
      >
        Permanent Deletion Warning
      </h3>

      <p class="text-xs text-slate-500 mb-6 leading-relaxed">
        Are you absolutely sure you want to permanently remove <br />
        <strong class="text-slate-800 font-bold">"{{ book.title }}"</strong>
        from the catalog?<br />
        This action immediately purges the item record from the database.
      </p>

      <!-- SUBMISSION PACKET-->
      <form
        action="{% url 'delete_book_backend' book.id %}"
        method="POST"
        class="w-full flex items-center justify-center space-x-3"
      >
        {% csrf_token %}

        <!-- Close Layer Button -->
        <!--CANCEL BUTTON -->
        <button
          type="button"
          onclick="document.getElementById('delete-modal-{{ book.id }}').style.setProperty('display', 'none', 'important')"
          class="px-5 py-2 h-10 rounded-lg text-xs font-bold uppercase tracking-wider transition shadow-sm focus:outline-none"
          style="
            background-color: #f1f5f9 !important;
            color: #334155 !important;
            border: 1px solid #cbd5e1 !important;
            display: inline-block !important;
            cursor: pointer !important;
            transition: all 0.15s ease-in-out !important;
          "
          onmouseover="
            this.style.backgroundColor = '#e2e8f0';
            this.style.borderColor = '#94a3b8';
          "
          onmouseout="
            this.style.backgroundColor = '#f1f5f9';
            this.style.borderColor = '#cbd5e1';
          "
        >
          Cancel
        </button>

        <!--CONFIRM DELETE BUTTON-->
        <button
          type="submit"
          class="px-5 py-2 h-10 rounded-lg text-xs font-bold uppercase tracking-wider transition shadow-sm focus:outline-none"
          style="
            background-color: #dc2626 !important;
            color: #ffffff !important;
            border: none !important;
            display: inline-block !important;
            cursor: pointer !important;
            transition: all 0.15s ease-in-out !important;
          "
          onmouseover="this.style.backgroundColor = '#b91c1c'"
          onmouseout="this.style.backgroundColor = '#dc2626'"
        >
          Confirm Delete
        </button>
      </form>
    </div>
  </div>
</div>
{% endfor %}
