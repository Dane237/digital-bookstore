<!-- MAIN OVERLAY WRAPPER: Centered viewport container matches bulk-department-modal ID -->
<div
  id="bulk-department-modal"
  class="fixed inset-0 w-full h-full bg-slate-900/40 backdrop-blur-sm p-4"
  style="
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    z-index: 99999 !important;
    display: none;
    align-items: center !important;
    justify-content: center !important;
  "
>
  <!-- Main Department Panel Card Box Layout Container -->
  <div
    id="assign-dept-card-panel"
    class="bg-white rounded-xl shadow-lg border border-slate-300 w-full max-w-md overflow-hidden flex flex-col mx-auto my-auto animate-pop"
    style="
      display: flex !important;
      padding: 18px !important;
      box-sizing: border-box !important;
    "
  >
    <!-- Header Title Bar Section -->
    <div
      class="bg-[#16163f] text-white p-4 px-6 flex justify-between items-center flex-shrink-0"
    >
      <h3 class="font-bold text-sm tracking-wide">Assign Department Names</h3>
      <!-- button avoids auto-formatter bugs -->
      <button
        type="button"
        onclick="
          document
            .getElementById('bulk-department-modal')
            .style.setProperty('display', 'none', 'important')
        "
        class="hover:opacity-75 text-lg font-bold transition focus:outline-none"
      >
        ✕
      </button>
    </div>

    <!-- Selectable Departments Checklist Form -->
    <form
      action="{% url 'bulk_update_books_backend' %}"
      method="POST"
      class="bg-white flex flex-col m-0"
      onclick="event.stopPropagation()"
    >
      {% csrf_token %}

      <!-- HOOKED INTERLINK SELECTION-->
      <input
        type="hidden"
        id="bulk-ids-dept-tracker"
        name="selected_book_ids_string"
        value=""
      />
      <input
        type="hidden"
        name="bulk_action_type_flag"
        value="bulk_assign_department"
      />

      <!-- Banner Alert Subsection -->
      <div
        class="bg-slate-50 border-b border-slate-100 p-4 px-6 flex flex-col gap-1 flex-shrink-0"
      >
        <p class="text-xs font-semibold text-slate-500">
          Applying to selected books.
        </p>
        <h4 class="text-sm font-black text-slate-800 tracking-tight mt-0.5">
          Select Departments to Assign
        </h4>
      </div>

      <!-- Checklist Rows Area -->

      {% for dept in departments %}
      <label
        class="dept-item-row flex items-center gap-2 py-1.5 cursor-pointer select-none hover:bg-slate-50 px-2 rounded-lg transition"
      >
        <input
          type="checkbox"
          name="bulk_department_value"
          value="{{ dept.name }}"
          class="dept-checkbox rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
        />
        <span class="text-sm font-semibold text-slate-700"
          >{{ dept.name }}</span
        >
      </label>
      {% empty %}
      <!-- Safe fallback statement-->
      <p
        class="text-xs text-slate-400 font-bold uppercase tracking-wider italic p-2"
      >
        No active departments found.
      </p>
      {% endfor %}

      <!-- Action Footer Controls Bar Buttons -->
      <div
        class="flex items-center justify-end space-x-3 p-4 px-6 border-t border-slate-200 bg-slate-50 flex-shrink-0"
      >
        <button
          type="button"
          onclick="
            document
              .getElementById('bulk-department-modal')
              .style.setProperty('display', 'none', 'important')
          "
          class="px-5 py-2 h-10 rounded-lg text-xs font-bold uppercase tracking-wider transition shadow-sm focus:outline-none"
          style="
            background-color: #f1f5f9 !important;
            color: #334155 !important;
            border: 1px solid #cbd5e1 !important;
            display: inline-block !important;
            cursor: pointer !important;
            transition: all 0.15s ease-in-out !important;
          "
          onmouseover="
            this.style.backgroundColor = '#e2e8f0';
            this.style.borderColor = '#94a3b8';
          "
          onmouseout="
            this.style.backgroundColor = '#f1f5f9';
            this.style.borderColor = '#cbd5e1';
          "
        >
          Cancel
        </button>

        <button
          type="submit"
          class="px-5 py-2 h-10 rounded-lg text-xs font-bold uppercase tracking-wider transition shadow-sm focus:outline-none"
          style="
            background-color: #eab308 !important; /* 💛 Professional warm amber/yellow fill */
            color: #0f172a !important; /* 💛 Ultra-dark slate text for perfect contrast readability */
            border: none !important;
            display: inline-block !important;
            cursor: pointer !important;
            transition: all 0.15s ease-in-out !important;
          "
          onmouseover="this.style.backgroundColor = '#ca8a04'"
          onmouseout="this.style.backgroundColor = '#eab308'"
        >
          Assign
        </button>
      </div>
    </form>
  </div>
</div>
